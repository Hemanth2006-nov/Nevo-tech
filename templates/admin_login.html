<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | NEVO TECH</title>
  <link rel="icon" type="image/png" href="/assets/nevo-logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #050811;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(37, 211, 102, 0.1) 0%, transparent 45%),
        linear-gradient(180deg, #050811 0%, #080d18 100%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(11, 19, 35, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 2.75rem 2.25rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(56, 189, 248, 0.12);
      text-align: center;
    }
    .login-brand-logo {
      height: 72px;
      width: auto;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 4px 14px rgba(56, 189, 248, 0.35));
    }
    .login-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.35rem;
    }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.45rem;
    }
    .form-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(137, 227, 245, 0.22);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
    }
    .btn-login {
      width: 100%;
      padding: 0.9rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border: none;
      color: #050811;
      font-weight: 800;
      font-size: 0.96rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
      transition: all 0.25s ease;
      margin-top: 0.5rem;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.55);
    }
    .login-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-size: 0.82rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.75rem;
      color: #64748b;
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .back-link:hover { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="login-card">
    <a href="/">
      <img src="/assets/nevo-logo.png" alt="NEVO TECH Logo" class="login-brand-logo">
    </a>
    <h1 class="login-title">Admin Portal</h1>
    <p class="login-subtitle">Sign in to manage student inquiries &amp; project briefs</p>

    {% if error %}
    <div class="login-error">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label class="form-label" for="admin-pwd">Admin Password</label>
        <input type="password" id="admin-pwd" name="password" class="form-input" placeholder="Enter admin password" required autofocus>
      </div>

      <button type="submit" class="btn-login">Sign In &rarr;</button>
    </form>

    <a href="/" class="back-link">&larr; Return to NEVO TECH Website</a>
  </div>
</body>
</html>
